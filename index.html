<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meeting Action Tracker</title>
<style>
/* Light theme only. Muted neutral palette, one orange accent. Red is reserved for overdue. */
:root {
  color-scheme: light;
  --bg: #f4f3f0;
  --card: #ffffff;
  --ink: #2b2a28;
  --muted: #77736c;
  --line: #e3e0da;
  --soft: #efece7;
  --accent: #d9692b;
  --accent-ink: #ffffff;
  --accent-soft: #fbeee5;
  --danger: #c0392b;
  --danger-soft: #fbeceb;
  --shadow: 0 1px 2px rgba(40, 35, 30, .06), 0 4px 16px rgba(40, 35, 30, .05);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }

header h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.01em; }
header p { margin: 0 0 24px; color: var(--muted); }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}

/* Summary counts */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.stat { padding: 16px 20px; }
.stat .num { font-size: 2.2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .lbl { color: var(--muted); font-size: 1rem; }
.stat.open .num { color: var(--accent); }
.stat.overdue .num { color: var(--danger); }
.stat.overdue.zero .num { color: var(--muted); }

/* Add form */
form.add { padding: 20px; margin-bottom: 28px; display: grid; gap: 14px;
  grid-template-columns: 2fr 1fr 1fr auto; align-items: end; }
label { display: block; font-size: .95rem; color: var(--muted); margin-bottom: 6px; }
input[type=text], input[type=date] {
  width: 100%; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; min-height: 50px;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary {
  font: inherit; font-weight: 600; border: 0; border-radius: 10px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); padding: 12px 22px; min-height: 50px;
}
button.primary:hover { filter: brightness(1.05); }
.formmsg { grid-column: 1 / -1; margin: -4px 0 0; color: var(--danger); font-size: .95rem; min-height: 0; }
.formmsg:empty { display: none; }

/* Toolbar */
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px;
  flex-wrap: wrap; margin-bottom: 14px; }
.toolbar h2 { margin: 0; font-size: 1.3rem; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 1rem; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Owner groups */
.groups { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-items: start; }
.group { padding: 18px 18px 8px; }
.group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-weight: 700;
  background: var(--soft); color: var(--ink);
}
.group-head h3 { margin: 0; font-size: 1.2rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pill { font-size: .85rem; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.late { background: var(--danger-soft); color: var(--danger); font-weight: 600; }

ul.items { list-style: none; margin: 0; padding: 0; }
li.item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start;
  padding: 12px 10px; margin: 0 -10px; border-top: 1px solid var(--line); border-radius: 8px;
}
li.item:first-child { border-top: 0; }
li.item input[type=checkbox] {
  width: 24px; height: 24px; margin: 3px 0 0; accent-color: var(--accent); cursor: pointer;
}
.item .text { overflow-wrap: anywhere; }
.item .due { display: block; font-size: .95rem; color: var(--muted); }
.item.done .text .title { text-decoration: line-through; color: var(--muted); }
.item.overdue { background: var(--danger-soft); border-top-color: transparent; }
.item.overdue + .item { border-top-color: transparent; }
.item.overdue .title, .item.overdue .due { color: var(--danger); }
.item.overdue .due { font-weight: 600; }
button.del {
  font: inherit; font-size: 1.3rem; line-height: 1; background: none; border: 0; cursor: pointer;
  color: var(--muted); padding: 4px 6px; border-radius: 6px; opacity: .55;
}
button.del:hover, button.del:focus-visible { opacity: 1; color: var(--danger); }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 1.2rem; margin-bottom: 4px; }

@media (max-width: 720px) {
  body { font-size: 17px; }
  header h1 { font-size: 1.6rem; }
  form.add { grid-template-columns: 1fr 1fr; }
  form.add .f-title { grid-column: 1 / -1; }
  form.add button { grid-column: 1 / -1; }
  .stat { padding: 12px 14px; }
  .stat .num { font-size: 1.8rem; }
  .groups { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meeting actions</h1>
    <p>Everything we agreed to do, by person. Tick it off when it's done.</p>
  </header>

  <section class="stats" aria-label="Summary">
    <div class="card stat open"><div class="num" id="nOpen">0</div><div class="lbl">Open</div></div>
    <div class="card stat done"><div class="num" id="nDone">0</div><div class="lbl">Done</div></div>
    <div class="card stat overdue" id="overdueCard"><div class="num" id="nOverdue">0</div><div class="lbl">Overdue</div></div>
  </section>

  <form class="card add" id="addForm" autocomplete="off">
    <div class="f-title">
      <label for="fTitle">Action</label>
      <input type="text" id="fTitle" placeholder="e.g. Send revised budget to finance" maxlength="200">
    </div>
    <div>
      <label for="fOwner">Owner</label>
      <input type="text" id="fOwner" placeholder="Name" list="owners" maxlength="60">
      <datalist id="owners"></datalist>
    </div>
    <div>
      <label for="fDue">Due date</label>
      <input type="date" id="fDue">
    </div>
    <button type="submit" class="primary">Add action</button>
    <p class="formmsg" id="formMsg" role="alert"></p>
  </form>

  <div class="toolbar">
    <h2>By owner</h2>
    <label class="toggle"><input type="checkbox" id="hideDone"> Hide done</label>
  </div>
  <div class="groups" id="groups"></div>
</div>

<script>
(function () {
  var KEY = 'meeting-action-tracker:v1';
  var PREF = 'meeting-action-tracker:hideDone';
  var actions = load();

  var el = function (id) { return document.getElementById(id); };
  var form = el('addForm'), fTitle = el('fTitle'), fOwner = el('fOwner'), fDue = el('fDue');
  var hideDone = el('hideDone');

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(actions)); } catch (e) {}
  }
  // Local calendar date as YYYY-MM-DD so it compares directly with <input type=date> values.
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function isOverdue(a) { return !a.done && a.due && a.due < today(); }
  function fmtDue(iso) {
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }
  function dueLabel(a) {
    if (!a.due) return 'No due date';
    var t = today();
    if (a.done) return 'Due ' + fmtDue(a.due);
    if (a.due < t) {
      var days = Math.round((Date.parse(t) - Date.parse(a.due)) / 864e5);
      return 'Overdue by ' + days + (days === 1 ? ' day' : ' days') + ' · ' + fmtDue(a.due);
    }
    if (a.due === t) return 'Due today';
    return 'Due ' + fmtDue(a.due);
  }
  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join('');
  }
  function node(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function render() {
    var open = 0, done = 0, overdue = 0;
    actions.forEach(function (a) { a.done ? done++ : open++; if (isOverdue(a)) overdue++; });
    el('nOpen').textContent = open;
    el('nDone').textContent = done;
    el('nOverdue').textContent = overdue;
    el('overdueCard').classList.toggle('zero', overdue === 0);

    // Owner suggestions, matched case-insensitively so "sam" and "Sam" share a card.
    var byOwner = {};
    actions.forEach(function (a) {
      var k = a.owner.toLowerCase();
      (byOwner[k] = byOwner[k] || { name: a.owner, items: [] }).items.push(a);
    });
    var dl = el('owners'); dl.innerHTML = '';
    Object.keys(byOwner).forEach(function (k) { var o = node('option'); o.value = byOwner[k].name; dl.appendChild(o); });

    var groups = Object.keys(byOwner).map(function (k) { return byOwner[k]; });
    // Owners with overdue work first, then most open actions, then name.
    function stats(g) {
      return { late: g.items.filter(isOverdue).length, open: g.items.filter(function (a) { return !a.done; }).length };
    }
    groups.sort(function (a, b) {
      var sa = stats(a), sb = stats(b);
      return (sb.late - sa.late) || (sb.open - sa.open) || a.name.localeCompare(b.name);
    });

    var wrap = el('groups'); wrap.innerHTML = '';
    var shown = 0;
    groups.forEach(function (g) {
      var items = g.items.slice().sort(function (a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return (a.due || '9999').localeCompare(b.due || '9999') || a.created - b.created;
      });
      if (hideDone.checked) items = items.filter(function (a) { return !a.done; });
      if (!items.length) return;
      shown++;
      var s = stats(g);

      var card = node('section', 'card group');
      var head = node('div', 'group-head');
      head.appendChild(node('div', 'avatar', initials(g.name)));
      head.appendChild(node('h3', null, g.name));
      if (s.late) head.appendChild(node('span', 'pill late', s.late + ' overdue'));
      head.appendChild(node('span', 'pill', s.open + ' open'));
      card.appendChild(head);

      var ul = node('ul', 'items');
      items.forEach(function (a) {
        var li = node('li', 'item' + (a.done ? ' done' : '') + (isOverdue(a) ? ' overdue' : ''));
        var cb = node('input');
        cb.type = 'checkbox'; cb.checked = a.done; cb.id = 'cb-' + a.id;
        cb.setAttribute('aria-label', 'Mark done: ' + a.title);
        cb.addEventListener('change', function () { a.done = cb.checked; save(); render(); });
        var text = node('label', 'text'); text.htmlFor = cb.id;
        text.appendChild(node('span', 'title', a.title));
        text.appendChild(node('span', 'due', dueLabel(a)));
        var del = node('button', 'del', '×');
        del.type = 'button'; del.title = 'Delete'; del.setAttribute('aria-label', 'Delete: ' + a.title);
        del.addEventListener('click', function () {
          if (!confirm('Delete "' + a.title + '"?')) return;
          actions = actions.filter(function (x) { return x.id !== a.id; }); save(); render();
        });
        li.appendChild(cb); li.appendChild(text); li.appendChild(del);
        ul.appendChild(li);
      });
      card.appendChild(ul);
      wrap.appendChild(card);
    });

    if (!shown) {
      var e = node('div', 'card empty');
      e.appendChild(node('strong', null, actions.length ? 'All done.' : 'No actions yet'));
      e.appendChild(document.createTextNode(actions.length ? 'Nothing open. Untick "Hide done" to see finished actions.' : 'Add the first action agreed in your meeting above.'));
      wrap.appendChild(e);
    }
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var title = fTitle.value.trim(), owner = fOwner.value.trim().replace(/\s+/g, ' ');
    var msg = el('formMsg');
    if (!title || !owner || !fDue.value) {
      msg.textContent = 'Please fill in the action, an owner and a due date.';
      (!title ? fTitle : !owner ? fOwner : fDue).focus();
      return;
    }
    msg.textContent = '';
    // Reuse the existing spelling of an owner's name if one matches.
    var existing = actions.find(function (a) { return a.owner.toLowerCase() === owner.toLowerCase(); });
    actions.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: title, owner: existing ? existing.owner : owner, due: fDue.value,
      done: false, created: Date.now()
    });
    save();
    fTitle.value = '';
    fTitle.focus();
    render();
  });

  try { hideDone.checked = localStorage.getItem(PREF) === '1'; } catch (e) {}
  hideDone.addEventListener('change', function () {
    try { localStorage.setItem(PREF, hideDone.checked ? '1' : '0'); } catch (e) {}
    render();
  });
  // Keep data in step with other open tabs, and re-check overdue state when the page comes back.
  window.addEventListener('storage', function (e) { if (e.key === KEY) { actions = load(); render(); } });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });

  fDue.value = today();
  render();
})();
</script>
</body>
</html>
